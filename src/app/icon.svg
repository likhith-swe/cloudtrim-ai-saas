<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64" fill="none">
  <defs>
    <linearGradient id="ct-bg" x1="0" y1="0" x2="64" y2="64" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#0c101c"/>
      <stop offset="100%" stop-color="#05070c"/>
    </linearGradient>
    <linearGradient id="ct-grad" x1="12" y1="12" x2="52" y2="52" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="50%" stop-color="#3ddc84"/>
      <stop offset="100%" stop-color="#b7ee4f"/>
    </linearGradient>
    <linearGradient id="ct-beam" x1="10" y1="54" x2="54" y2="10" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#3ddc84"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Background Base with subtle border -->
  <rect width="64" height="64" rx="16" fill="url(#ct-bg)"/>
  <rect width="62" height="62" x="1" y="1" rx="15" stroke="rgba(255,255,255,0.12)" stroke-width="1"/>

  <!-- Cloud Trim Monogram Silhouette -->
  <path d="M44 38C47.3 38 50 35.3 50 32C50 28.9 47.7 26.3 44.7 26.1C44.1 20.4 39.3 16 33.5 16C28.4 16 24.1 19.4 22.8 24.1C22.2 24 21.6 24 21 24C17.1 24 14 27.1 14 31C14 34.9 17.1 38 21 38L44 38Z" 
        fill="url(#ct-grad)" 
        opacity="0.95"/>

  <!-- Precision Diagonal Laser Trim Cut -->
  <path d="M12 46L52 18" 
        stroke="url(#ct-beam)" 
        stroke-width="3" 
        stroke-linecap="round" 
        filter="url(#glow)"/>

  <!-- Precision Trim Sparks -->
  <circle cx="32" cy="32" r="2.5" fill="#ffffff"/>
  <circle cx="52" cy="18" r="1.8" fill="#38bdf8"/>
</svg>
